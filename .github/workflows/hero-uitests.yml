# The app's UI suites (UITests/): a nightly smoke on develop, and any suite
# on demand.
#
# Deliberately NOT part of the PR-gating `build-test` loop: these boot a
# simulator, drive real gestures and record evidence — minutes of runner time
# per suite, and the package-level suites already gate every PR. The nightly
# run (#2389) is the smoke: guest mode end to end and the hero card and
# fallback. A red night comes back to whoever last touched what it drives.
# Trigger it by hand (or from a branch) when the transition stack or the
# guest flow changes in ways only a finger can vouch for.
name: hero-uitests
on:
  schedule:
    # 03:00 UTC, when no pull request is waiting for a macOS runner.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: "Suites, space-separated (e.g. HeroMatrixUITests GuestModeUITests); empty runs every UI suite"
        required: false
        default: ""

jobs:
  hero-uitests:
    # The self-hosted Mac (Xcode 27), like ci.yml's test lanes; the repository
    # variable MACOS_RUNNER=github sends it back to macos-latest (Xcode 26).
    runs-on: ${{ vars.MACOS_RUNNER == 'github' && 'macos-latest' || fromJSON('["self-hosted", "macOS", "ARM64", "xcode"]') }}
    timeout-minutes: 60
    env:
      SPM: ${{ github.workspace }}/.spm
    steps:
      - uses: actions/checkout@v4

      # Same nondeterministic-runner dance as ci.yml: pick the newest Xcode 26.
      - name: Select Xcode 26
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "no Xcode 26.x on this runner"; exit 1; fi
          sudo xcode-select -s "$XC/Contents/Developer"

      - name: Toolchain
        run: xcodebuild -version

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies -project core-platform-ios.xcodeproj \
            -scheme core-platform-ios -clonedSourcePackagesDirPath "$SPM"

      - name: Pick simulator
        id: sim
        run: |
          DEST_ID=$(xcodebuild -project core-platform-ios.xcodeproj -scheme core-platform-ios \
            -showdestinations 2>/dev/null \
            | grep "platform:iOS Simulator" | grep "name:iPhone" \
            | head -1 | sed -E 's/.*id:([A-F0-9-]+).*/\1/')
          if [ -z "$DEST_ID" ]; then echo "no iPhone simulator destination"; exit 1; fi
          echo "id=$DEST_ID" >> "$GITHUB_OUTPUT"

      - name: Run Hero UI suites
        run: |
          # The nightly smoke when scheduled; the dispatch's suites otherwise.
          SUITES="${{ inputs.suite }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            SUITES="GuestModeUITests HeroCardUITests HeroFallbackUITests"
          fi
          ONLY=()
          for suite in $SUITES; do ONLY+=("-only-testing:core-platform-iosUITests/$suite"); done
          if [ ${#ONLY[@]} -eq 0 ]; then ONLY=("-only-testing:core-platform-iosUITests"); fi
          xcodebuild test -project core-platform-ios.xcodeproj \
            -scheme core-platform-ios \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -clonedSourcePackagesDirPath "$SPM" -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath hero-uitests.xcresult \
            -parallel-testing-enabled NO \
            "${ONLY[@]}"

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-uitests-results
          path: hero-uitests.xcresult
          if-no-files-found: ignore
