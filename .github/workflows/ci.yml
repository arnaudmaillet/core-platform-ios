name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

# A pull request's new push cancels its own stale run. A push to develop never
# cancels the one in progress: it waits, and a newer push replaces it while it
# waits, so one full run is always going and the latest develop is always the
# next one tested.
#
# ⚠️ WHY develop MUST NOT CANCEL ITSELF. A pull request runs only the lanes
# `select_packages.py` picks from its diff, so the run on develop is the ONLY
# full-suite run. With cancel-in-progress it was the run every merge killed:
# on 2026-10-05, nine of the twelve develop runs between 09:26 and 20:08 UTC
# were CANCELLED, and one that did finish (70cd349) caught a break no pull
# request run could see — #530, a Feed-only change, failing DesignSystem's
# repo-wide font guard.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Compile-time savings that change nothing a build can catch:
#
# - No index store (NO_INDEX, on every compile). xcodebuild indexes while it
#   builds by default; CI never opens the index.
# - ARCHS=arm64 on the app builds. `generic/platform=iOS Simulator`
#   has no active arch, so Debug and Release each compiled the whole graph
#   TWICE, arm64 and x86_64 (1354 SwiftCompile lines of each in run
#   36793858807). Every runner and every Mac this project targets is Apple
#   silicon; the test lanes already build arm64 only, through their concrete
#   destination.
#
# - Compilation caching on the app's Debug build (#2369). Every compile is
#   keyed on its inputs and its whole command line in a content-addressed
#   store; a key includes the module's search paths, so unlike a shared
#   DerivedData it hides no missing dependency. Keys also include absolute
#   paths, which are the same on every runner, so the store develop saved
#   answers the next run's unchanged modules. (Prefix mapping would make keys
#   path-free, for worktrees too, but Swift crashes replaying cached warnings
#   with it on: Xcode 27.2, `replayCachedDiagnostics`.) Only a push to develop
#   saves the store, so pull requests never fill the repository's 10 GB cache
#   with copies of their own.
env:
  NO_INDEX: COMPILER_INDEX_STORE_ENABLE=NO
  CAS_DIR: /Users/runner/compilation-cas

jobs:
  # ── Which packages have tests ────────────────────────────────────────────
  # Ubuntu, not macOS: this is a `find` over the working tree, and macOS
  # runners are the scarce resource (5 concurrent GitHub-hosted on the free
  # plan for public repos; one self-hosted Mac for the test lanes). Emits the
  # matrix the test job fans out over.
  discover:
    name: discover packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      count: ${{ steps.list.outputs.count }}
      hosted_matrix: ${{ steps.list.outputs.hosted_matrix }}
      hosted_count: ${{ steps.list.outputs.hosted_count }}
      app: ${{ steps.list.outputs.app }}
    steps:
      # ⚠️ A PUSH TO DEVELOP WAITS ITS TURN. Every merge is followed within a
      # minute by `update-branch` on the next pull request, so the develop run
      # and that pull request's run were queued together — and the develop run,
      # a few seconds older and twice the size (every lane), took the macOS
      # slots first: the pull request someone is waiting on queued behind a
      # backstop nobody is. Three minutes of an Ubuntu runner (free here) puts
      # the backstop behind it instead. A merge landing meanwhile no longer
      # cancels it (see `concurrency`): its run waits, replacing any older
      # waiting one, and goes once this backstop has finished.
      - name: Let pull request runs go first
        if: ${{ github.event_name == 'push' }}
        run: sleep 180

      - uses: actions/checkout@v4
        with:
          # Full history: the lane selection diffs against the pull request's
          # base commit, and a shallow clone has nothing to diff against.
          fetch-depth: 0

      - name: Choose test lanes
        id: list
        env:
          # Empty on a push to develop, which is what makes that run the full
          # set — the backstop for a closure this script got wrong.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # `github` (the Mac off): every lane goes to the hosted job.
          MACOS_RUNNER: ${{ vars.MACOS_RUNNER }}
          # `1` (GitHub's macOS capacity out): the hosted lanes go to the Mac
          # too. MACOS_RUNNER=github wins when both are set.
          HOSTED_LANES_ON_MAC: ${{ vars.HOSTED_LANES_ON_MAC }}
        run: python3 .github/scripts/select_packages.py

  # ── The app itself ───────────────────────────────────────────────────────
  # Runs alongside the test lanes. It is the whole critical path of a pull
  # request that reaches one lane or none, so every minute here is a minute of
  # waiting on those.
  build-app:
    name: build app
    needs: discover
    # Skipped only for a documentation-only change (see select_packages.py).
    if: ${{ needs.discover.outputs.app == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          # macos-latest's default Xcode is nondeterministic; the project needs
          # the iOS 26 SDK (Liquid Glass APIs). Pin the newest installed Xcode
          # 26.x rather than trusting the default.
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "No Xcode 26.x found on this runner" >&2
            ls -d /Applications/Xcode_*.app 2>/dev/null >&2 || true
            exit 1
          fi
          echo "Selecting $XC"
          sudo xcode-select -s "$XC/Contents/Developer"

      - name: Toolchain & simulators
        run: |
          xcodebuild -version
          echo "--- installed iOS runtimes ---"
          xcrun simctl list runtimes | grep -i ios || true

      # The remote packages' git mirrors (SwiftProtobuf, Connect and the NIO
      # stack, Lottie) in SwiftPM's shared cache, which xcodebuild clones from
      # before it touches the network. A cold runner fetched all nine from
      # GitHub in every job: 0.3-1.4 min per lane, ~14 macOS minutes per full
      # run. Only the MIRRORS: `.spm`'s checkouts and workspace state are
      # recreated from them in seconds, and restoring a stale checkout is how a
      # cache starts answering for a resolution it did not make. This job
      # resolves the app, which reaches every remote package, so it is the one
      # that saves; the lanes only restore. A mirror holds every tag, so the
      # lanes' own (older) pins resolve from it too.
      - name: Cache Swift package mirrors
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm/repositories
          key: spm-mirrors-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-mirrors-

      # The store develop saved last (see the header): this commit's, else the
      # newest for these package pins, else any.
      - name: Restore compilation cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CAS_DIR }}
          key: cas-v1-${{ hashFiles('**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            cas-v1-${{ hashFiles('**/Package.resolved') }}-
            cas-v1-

      - name: Resolve Swift packages
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project core-platform-ios.xcodeproj \
            -scheme core-platform-ios \
            -clonedSourcePackagesDirPath .spm

      - name: Build app
        run: |
          set -o pipefail
          build() {
            xcodebuild build \
              -project core-platform-ios.xcodeproj \
              -scheme core-platform-ios \
              -destination "generic/platform=iOS Simulator" \
              -configuration Debug \
              -clonedSourcePackagesDirPath .spm \
              -skipMacroValidation \
              CODE_SIGNING_ALLOWED=NO ARCHS=arm64 "$NO_INDEX" "$@" 2>&1 | tee build-debug.log
          }
          if ! build COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH="$CAS_DIR" \
                     COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES; then
            # A crash of the build service is the cache's fault, not the
            # change's: build again without it rather than fail the run.
            grep -q "build system has crashed" build-debug.log || exit 1
            echo "::warning::The build service crashed with compilation caching on; building without it"
            build COMPILATION_CACHE_ENABLE_CACHING=NO
          fi
          HITS=$(grep -c '^Cache hit' build-debug.log || true)
          MISSES=$(grep -c '^Cache miss' build-debug.log || true)
          echo "Compilation cache (Debug): $HITS hits, $MISSES misses" | tee -a "$GITHUB_STEP_SUMMARY"

      # Saved by develop only (see the header), under this commit's key.
      - name: Save compilation cache
        if: ${{ github.event_name == 'push' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CAS_DIR }}
          key: cas-v1-${{ hashFiles('**/Package.resolved') }}-${{ github.sha }}

      # ⚠️ RELEASE TOO, AND THIS STEP EXISTS BECAUSE ITS ABSENCE SHIPPED.
      #
      # Everything above builds Debug, so `#if DEBUG` members and the code that
      # calls them are compiled together and always agree. A production call
      # site reaching a fenced member is then invisible: the app simply does
      # not compile for Release, and nothing here noticed for months. Six of
      # them had accumulated across two pull requests.
      #
      # It is a compile, not a test run — the point is the configuration, and
      # the tests all build Debug for the simulator anyway.
      #
      # So a pull request compiles Release WITHOUT the optimiser: the
      # configuration (no DEBUG condition, Release's own settings) is what
      # catches a fenced member, and `-O` over the whole graph was 5.7 of this
      # job's 9.8 minutes (PR #354). The optimiser still runs on every push to
      # develop, where a crash inside it would surface — nobody waits on that
      # run.
      #
      # TWO RELEASE BUILDS SINCE #2391, sharing one DerivedData so the packages
      # compile once: the production app (`core-platform-ios-production`, the
      # real backend only, no `MOCK_BACKEND`) and Demo (`core-platform-ios` in
      # Release: the mock backend, `MOCK_BACKEND` without DEBUG). Each is a
      # combination no other build compiles.
      #
      # ⚠️ CLANG_COVERAGE_MAPPING=NO ON BOTH. `core-platform-ios`'s scheme
      # gathers coverage for its UI tests, and Xcode then instruments every
      # module it builds, packages included (`-profile-generate`), even for a
      # plain `build`; the production scheme has no tests, so it does not. The
      # two builds' packages then differed by those flags and Demo compiled the
      # whole graph again. Nobody reads coverage from a Release build.
      - name: Build app (Release, production)
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -o pipefail
          OPT=()
          if [ "$EVENT" = "pull_request" ]; then
            OPT=(SWIFT_OPTIMIZATION_LEVEL=-Onone GCC_OPTIMIZATION_LEVEL=0)
          fi
          xcodebuild build \
            -project core-platform-ios.xcodeproj \
            -scheme core-platform-ios-production \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-release" \
            -clonedSourcePackagesDirPath .spm \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 CLANG_COVERAGE_MAPPING=NO "$NO_INDEX" "${OPT[@]}"

      # ⚠️ THE PRODUCTION APP SHIPS NO MOCK (#2391). Its target does not list
      # the mock products, so this holds by construction; the step is what
      # notices the day it stops: a mock product added to the target, or a
      # package that starts depending on one.
      - name: Check the production app carries no mock
        run: |
          set -euo pipefail
          DD="$RUNNER_TEMP/DerivedData-release"
          APP="$DD/Build/Products/Release-iphonesimulator/YuyuProduction.app"
          BIN="$APP/YuyuProduction"
          [ -f "$BIN" ] || { echo "::error::no production binary at $BIN"; exit 1; }
          BUNDLES=$(find "$APP" -maxdepth 2 -name '*Mocks*.bundle')
          if [ -n "$BUNDLES" ]; then
            echo "::error::mock resources in the production app: $BUNDLES"; exit 1
          fi
          SYMBOLS=$(nm "$BIN" | xcrun swift-demangle | grep -cE '(CoreNetworkingMocks|CoreRealtimeMocks)\.' || true)
          if [ "$SYMBOLS" -ne 0 ]; then
            echo "::error::$SYMBOLS mock symbols in the production binary"
            nm "$BIN" | xcrun swift-demangle | grep -E '(CoreNetworkingMocks|CoreRealtimeMocks)\.' | head -20
            exit 1
          fi
          LISTS=$(find "$DD/Build/Intermediates.noindex" -name 'YuyuProduction.LinkFileList')
          [ -n "$LISTS" ] || { echo "::error::no LinkFileList for the production app"; exit 1; }
          if grep -hE '/(CoreNetworkingMocks|CoreRealtimeMocks)\.o$' $LISTS; then
            echo "::error::the production app links a mock object"; exit 1
          fi
          echo "Production app: $(du -sh "$APP" | cut -f1), no mock bundle, 0 mock symbols, no mock object linked" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build app (Release, Demo)
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -o pipefail
          OPT=()
          if [ "$EVENT" = "pull_request" ]; then
            OPT=(SWIFT_OPTIMIZATION_LEVEL=-Onone GCC_OPTIMIZATION_LEVEL=0)
          fi
          xcodebuild build \
            -project core-platform-ios.xcodeproj \
            -scheme core-platform-ios \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-release" \
            -clonedSourcePackagesDirPath .spm \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 CLANG_COVERAGE_MAPPING=NO "$NO_INDEX" "${OPT[@]}"

  # ── One lane per package ─────────────────────────────────────────────────
  # Was a sequential loop in a single job: 18 invocations, 45 min, of which
  # ~5 min was test execution. The rest was the shared dependency graph
  # (SwiftProtobuf, Connect, CoreModels, DesignSystem) recompiled once per
  # package, because each package gets its own DerivedData tree. Parallelism,
  # not sharing DerivedData, is the fix: a shared tree would put every module
  # on every target's search path and hide exactly the missing-dependency bug
  # this CI exists to catch (PR #127).
  #
  # ⚠️ TWO MACHINES, SIDE BY SIDE (#2370). The lanes `select_packages.py`
  # lists in HOSTED_LANES (data and logic: models, storage, networking, Chat,
  # Search…) run on GitHub's hosted Macs with Xcode 26, `test-hosted`; every
  # other lane runs on the self-hosted Mac with Xcode 27, `test`. One Mac runs
  # ONE job at a time, so with every lane on it a run's jobs queued there for
  # hours while the five hosted slots held two. Suites that measure time, play
  # media or animate stay on the Mac: a hosted runner is a slower, shared VM.
  #
  # `build app` and `compile tests` stay on GitHub, Xcode 26: Xcode 26 can
  # reject Swift that 27 accepts, so it still compiles the app (Debug and
  # Release) and the Mac lanes' tests. The hosted lanes are Xcode 26 already.
  #
  # No DerivedData persists between runs on the Mac: a package's is ~3 GB, the
  # Mac has little disk, and a tree kept across runs can keep a lane green on
  # a module that no longer exists. Each package builds in the job's temporary
  # directory, deleted as soon as its tests have run (`run_lanes.sh`). What
  # does persist is the compilation cache (`run_lanes.sh`, capped at 15 GB):
  # content-addressed, keyed on each compile's inputs and command line, so it
  # answers only a compile that would produce the same output.
  #
  # Mac off, asleep or busy for good: set the repository variable
  # MACOS_RUNNER=github (Settings → Secrets and variables → Actions →
  # Variables) and every lane goes to `test-hosted`, Xcode 26.
  #
  # GitHub's hosted macOS capacity out (jobs cancelled with "not acquired by
  # Runner of type hosted"): set HOSTED_LANES_ON_MAC=1 and the hosted lanes
  # run here too. `compile tests` still compiles them on Xcode 26, since it
  # covers every lane of this job. `build app` and `compile tests` stay
  # hosted: the Mac has no Xcode 26. A rerun keeps the variables of the run
  # it reruns, so a run started before the change needs a new push.
  test:
    name: test ${{ matrix.pkg.label }}
    needs: discover
    # A change that cannot reach a Mac lane selects none. Guard on the count
    # rather than handing GitHub an empty matrix.
    if: ${{ needs.discover.outputs.count != '0' }}
    runs-on: ${{ fromJSON('["self-hosted", "macOS", "ARM64", "xcode"]') }}
    timeout-minutes: 45
    strategy:
      fail-fast: false      # one red package must not hide the others
      matrix:
        # Longest lane first (select_packages.py).
        pkg: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      # The self-hosted Mac uses the Xcode its owner selected: no `sudo`
      # there, it would wait on a password. It keeps its own Swift package
      # mirrors between runs.
      - name: This Mac's Xcode, and disk
        run: |
          xcodebuild -version
          df -h "$RUNNER_TEMP" | awk 'NR==2 {print "Free disk: " $4}'

      - name: Test ${{ matrix.pkg.label }}
        env:
          # Empty for every lane but the legacy-backing one. VideoRenderFlags
          # only reacts to the literal "0", so an empty value is the default
          # path — no conditional needed.
          TEST_RUNNER_AVSBDL_RENDER: ${{ matrix.pkg.avsbdl }}
          LANES: ${{ matrix.pkg.lanes }}
        run: .github/scripts/run_lanes.sh

  # The hosted half of the lanes (see `test`), on GitHub's macOS runners.
  test-hosted:
    name: test ${{ matrix.pkg.label }} (hosted)
    needs: discover
    if: ${{ needs.discover.outputs.hosted_count != '0' }}
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # The free plan allows 5 concurrent hosted macOS jobs across the
      # account, and `build app` and `compile tests` take two of them: 3
      # hosted lanes at once, for a pull request and the develop backstop
      # alike. With MACOS_RUNNER=github there is no `compile tests`, and every
      # lane is here: 4 for a pull request, 3 for the backstop.
      #
      # ⚠️ THE BACKSTOP RAN ITS HOSTED LANES ONE AT A TIME, and they took 63
      # minutes, as long as the Mac's (run 43607137004): once the Mac's lanes
      # compile through their cache, the hosted side was the whole backstop.
      # A pull request opened meanwhile waits for a slot at most one lane's
      # length (≤ 14 min), and the backstop's discover already lets a pull
      # request queued with it go first.
      max-parallel: ${{ vars.MACOS_RUNNER == 'github' && (github.event_name == 'push' && 3 || 4) || 3 }}
      matrix:
        pkg: ${{ fromJSON(needs.discover.outputs.hosted_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "No Xcode 26.x found on this runner" >&2
            ls -d /Applications/Xcode_*.app 2>/dev/null >&2 || true
            exit 1
          fi
          echo "Selecting $XC"
          sudo xcode-select -s "$XC/Contents/Developer"

      # Restore only: `build app` saves these (see there).
      - name: Restore Swift package mirrors
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm/repositories
          key: spm-mirrors-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-mirrors-

      - name: Test ${{ matrix.pkg.label }}
        env:
          TEST_RUNNER_AVSBDL_RENDER: ${{ matrix.pkg.avsbdl }}
          LANES: ${{ matrix.pkg.lanes }}
        run: .github/scripts/run_lanes.sh

  # ── The lanes' tests, compiled by Xcode 26 ───────────────────────────────
  # The Mac's lanes test with its Xcode 27, and `build app` never compiles a
  # test file, so without this job a test only Xcode 27 accepts would go green
  # here and break the first run on the MACOS_RUNNER=github fallback. It
  # compiles (`build-for-testing`, nothing runs) every package the MAC's lanes
  # selected, on GitHub's Xcode 26, in ONE job. The hosted lanes need none:
  # they are Xcode 26 themselves.
  #
  # ONE DerivedData for every package, unlike the lanes: this job only asks
  # whether Xcode 26 accepts the Swift, so the shared graph (SwiftProtobuf,
  # Connect, CoreModels, DesignSystem) compiles once. The missing-dependency
  # check (#127) stays with the lanes, which build each package alone.
  #
  # Skipped with MACOS_RUNNER=github: the lanes are Xcode 26 themselves then.
  compile-tests:
    name: compile tests (Xcode 26)
    needs: discover
    if: ${{ needs.discover.outputs.count != '0' && vars.MACOS_RUNNER != 'github' }}
    runs-on: macos-latest
    # develop selects every package: 56.5 min on 34378740c, past 60 once
    # ThreadKit gained a test target (4e46aafd2). A hosted job may run 6 h.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "No Xcode 26.x found on this runner" >&2
            ls -d /Applications/Xcode_*.app 2>/dev/null >&2 || true
            exit 1
          fi
          echo "Selecting $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      # Restore only: `build app` saves these (see there).
      - name: Restore Swift package mirrors
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm/repositories
          key: spm-mirrors-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-mirrors-

      # One build per package directory: Feed's two shards and MediaPlayback's
      # legacy lane compile the same tests as their siblings.
      - name: Compile the selected packages' tests
        env:
          MATRIX: ${{ needs.discover.outputs.matrix }}
        run: |
          set -o pipefail
          SPM="$GITHUB_WORKSPACE/.spm"
          DERIVED="$RUNNER_TEMP/DerivedData"
          DIRS=$(jq -r '.[].lanes' <<< "$MATRIX" \
            | tr ' ' '\n' | paste - - - - | awk '{print $1 " " $2}' | sort -u)
          FAILED=()
          while read -r DIR NAME; do
            echo "::group::$NAME"
            if ! (
              cd "$GITHUB_WORKSPACE/$DIR"
              xcodebuild -resolvePackageDependencies -scheme "$NAME" -clonedSourcePackagesDirPath "$SPM"
              # Same scheme choice as the lanes: "<name>-Package" carries the
              # test action of a multi-product package.
              SCHEME="$NAME"
              if xcodebuild -list -clonedSourcePackagesDirPath "$SPM" 2>/dev/null \
                   | grep -qE "^[[:space:]]+${NAME}-Package$"; then
                SCHEME="${NAME}-Package"
              fi
              xcodebuild build-for-testing -scheme "$SCHEME" \
                -destination "generic/platform=iOS Simulator" \
                -clonedSourcePackagesDirPath "$SPM" -derivedDataPath "$DERIVED" \
                -skipMacroValidation CODE_SIGNING_ALLOWED=NO ARCHS=arm64 "$NO_INDEX"
            ); then
              FAILED+=("$NAME")
              echo "::error::$NAME's tests do not compile with Xcode 26"
            fi
            echo "::endgroup::"
          done <<< "$DIRS"
          if [ ${#FAILED[@]} -ne 0 ]; then
            echo "::error::Xcode 26 rejects the tests of: ${FAILED[*]}"
            exit 1
          fi

  # ── SwiftLint (#2519, blocking since #2543) ──────────────────────────────
  # Ubuntu and SwiftLint's own container: no macOS runner is spent.
  # - A pull request lints the Swift files it adds or changes. An ERROR on a
  #   line the pull request adds or modifies fails this job, and with it
  #   `build-test`. Warnings, and errors on lines it doesn't touch (develop's
  #   existing debt), stay annotations. Fix the line, or silence one finding
  #   with `// swiftlint:disable:next <rule>` and say why beside it.
  # - A push to develop lints every file and never fails: the count per rule
  #   goes to the job summary and the report to the `swiftlint-report`
  #   artifact (`gh run download <run> -n swiftlint-report`), the debt to pay
  #   down.
  # - Findings are anchored where SwiftLint reports them: a length or
  #   complexity rule on its declaration's line, so it blocks only when that
  #   line changes.
  # - If SwiftLint itself produces no report, the job warns and passes: a
  #   broken linter doesn't stop the queue.
  lint:
    name: swiftlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pick the files
        id: files
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only --diff-filter=AMR "${{ github.event.pull_request.base.sha }}"...HEAD -- '*.swift' \
              | grep -E '^(App|Packages)/' | grep -v '/Generated/' > lint-files.txt || true
          else
            git ls-files -- 'App/*.swift' 'Packages/*.swift' | grep -v '/Generated/' > lint-files.txt
          fi
          echo "count=$(wc -l < lint-files.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - name: Lint
        if: steps.files.outputs.count != '0'
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          # The list goes in through the environment, as SwiftLint's
          # SCRIPT_INPUT_FILE_* variables, so no command line grows past
          # its limit on a push that lints every file.
          ENVFILE=lint-env.txt; : > "$ENVFILE"
          i=0
          while IFS= read -r f; do echo "SCRIPT_INPUT_FILE_$i=$f" >> "$ENVFILE"; i=$((i+1)); done < lint-files.txt
          echo "SCRIPT_INPUT_FILE_COUNT=$i" >> "$ENVFILE"
          docker run --rm --env-file "$ENVFILE" -v "$PWD:/work" -w /work ghcr.io/realm/swiftlint:0.57.0 \
            swiftlint lint --use-script-input-files --config .swiftlint.yml --reporter json > lint.json || true
          # The lines each file adds or modifies, from the zero-context diff.
          if [ "$EVENT" = "pull_request" ]; then
            git diff -U0 --diff-filter=AMR "$BASE"...HEAD -- '*.swift' > lint-diff.txt
          else
            : > lint-diff.txt
          fi
          python3 - <<'PY'
          import json, collections, os, re
          pull_request = os.environ["EVENT"] == "pull_request"
          try:
              findings = json.load(open("lint.json"))
          except Exception as error:
              print(f"::warning::SwiftLint produced no report: {error}")
              raise SystemExit(0)
          touched = collections.defaultdict(set)
          path = None
          for line in open("lint-diff.txt", errors="replace"):
              if line.startswith("+++ "):
                  path = line[4:].strip()
                  path = path[2:] if path.startswith("b/") else None
              elif line.startswith("@@") and path:
                  hunk = re.match(r"@@ -\S+ \+(\d+)(?:,(\d+))? @@", line)
                  if hunk:
                      first, count = int(hunk.group(1)), int(hunk.group(2) or "1")
                      touched[path].update(range(first, first + count))
          root = os.getcwd() + "/"
          blocking, existing = [], []
          for f in findings:
              f["path"] = (f.get("file") or "").replace("/work/", "").replace(root, "")
              line = f.get("line") or 1
              if f.get("severity") == "Error" and pull_request and line in touched[f["path"]]:
                  blocking.append(f)
              else:
                  existing.append(f)
          def annotate(f, level, suffix=""):
              message = f.get("reason", "").replace("\n", " ")
              print(f"::{level} file={f['path']},line={f.get('line') or 1},title=SwiftLint {f.get('rule_id')}{suffix}::{message}")
          for f in blocking:
              annotate(f, "error")
          for f in existing[: max(0, 500 - len(blocking))]:
              annotate(f, "warning", " (existing error, not blocking)" if f.get("severity") == "Error" else "")
          by_rule = collections.Counter((f.get("rule_id"), f.get("severity")) for f in findings)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"### SwiftLint: {len(findings)} findings, {len(blocking)} blocking\n\n")
              summary.write("| Rule | Severity | Count |\n|---|---|---|\n")
              for (rule, severity), count in by_rule.most_common():
                  summary.write(f"| {rule} | {severity} | {count} |\n")
          if blocking:
              print(f"::error::SwiftLint: {len(blocking)} error(s) on lines this pull request adds or modifies")
              raise SystemExit(1)
          PY
      # The summary can't be read through the API; the raw report can, with
      # `gh run download <run> -n swiftlint-report`. Kept even when the lint
      # step fails.
      - name: Keep the report
        if: ${{ !cancelled() && steps.files.outputs.count != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: swiftlint-report
          path: lint.json
          if-no-files-found: ignore
          retention-days: 14

  # ── The required check ───────────────────────────────────────────────────
  # `develop`'s branch protection requires a status check literally named
  # "build-test". Keep this job's name in sync with it, or merges stop being
  # gated on anything.
  build-test:
    name: build-test
    needs: [discover, build-app, test, test-hosted, compile-tests, lint]
    # !cancelled(), not always(): with always() a cancelled run would still
    # report a red required check instead of no check at all.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Collect results
        run: |
          set -uo pipefail
          echo "discover:  ${{ needs.discover.result }}"
          echo "build-app: ${{ needs.build-app.result }}"
          echo "test:      ${{ needs.test.result }}"   # aggregate of the Mac's lanes
          echo "test-hosted: ${{ needs.test-hosted.result }}"   # and the hosted ones
          echo "compile-tests: ${{ needs.compile-tests.result }}"
          echo "lint:      ${{ needs.lint.result }}"
          FAILED=()
          [ "${{ needs.discover.result }}"  = "success" ] || FAILED+=("discover")
          # "skipped" is a pass ONLY when discover said so (documentation-only
          # change). A build skipped for any other reason is not a green build.
          case "${{ needs.build-app.result }}/${{ needs.discover.outputs.app }}" in
            success/*|skipped/false) ;;
            *) FAILED+=("build-app") ;;
          esac
          # "skipped" is a pass here: it means the change could not reach any
          # package. Without this the required check fails on a docs-only or
          # app-only pull request.
          case "${{ needs.test.result }}" in
            success|skipped) ;;
            *) FAILED+=("test") ;;
          esac
          case "${{ needs.test-hosted.result }}" in
            success|skipped) ;;
            *) FAILED+=("test-hosted") ;;
          esac
          # Skipped with the lanes (no package reached), or because the lanes
          # ran on Xcode 26 themselves (MACOS_RUNNER=github).
          case "${{ needs.compile-tests.result }}" in
            success|skipped) ;;
            *) FAILED+=("compile-tests") ;;
          esac
          # SwiftLint (#2543): red only for an error on a line the pull
          # request adds or modifies. It never skips; "skipped" would mean
          # the workflow changed, so it is not a pass.
          [ "${{ needs.lint.result }}" = "success" ] || FAILED+=("lint")
          if [ ${#FAILED[@]} -ne 0 ]; then
            echo "::error::Failed: ${FAILED[*]} — open the job list above for the failing lane"
            exit 1
          fi
          if [ "${{ needs.build-app.result }}" = "skipped" ]; then
            echo "Documentation-only change: nothing to build or test."
          elif [ "${{ needs.test.result }}" = "skipped" ] && [ "${{ needs.test-hosted.result }}" = "skipped" ]; then
            echo "App builds (Debug, Release, Demo) passed. No package could be reached by this change, so no lane ran."
          else
            echo "App builds (Debug, Release, Demo) and every selected package test passed."
          fi
