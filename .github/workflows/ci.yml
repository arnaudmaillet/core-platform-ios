name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          # macos-latest's default Xcode is nondeterministic; the project needs
          # the iOS 26 SDK (Liquid Glass APIs, 26.5 deployment target). Pin the
          # newest installed Xcode 26.x rather than trusting the default.
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "No Xcode 26.x found on this runner" >&2
            ls -d /Applications/Xcode_*.app 2>/dev/null >&2 || true
            exit 1
          fi
          echo "Selecting $XC"
          sudo xcode-select -s "$XC/Contents/Developer"

      - name: Toolchain & simulators
        run: |
          xcodebuild -version
          echo "--- installed iOS runtimes ---"
          xcrun simctl list runtimes | grep -i ios || true

      - name: Resolve Swift packages
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project core-platform-ios.xcodeproj \
            -scheme core-platform-ios \
            -clonedSourcePackagesDirPath .spm

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild build \
            -project core-platform-ios.xcodeproj \
            -scheme core-platform-ios \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            -clonedSourcePackagesDirPath .spm \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Test Profile package
        working-directory: Packages/Features/Profile
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -scheme Profile \
            -clonedSourcePackagesDirPath .spm
          # Pick a concrete iPhone simulator from xcodebuild's own destination
          # list (guaranteed valid for this scheme, unlike a simctl id).
          DEST_ID=$(xcodebuild -scheme Profile -showdestinations \
            -clonedSourcePackagesDirPath .spm 2>/dev/null \
            | grep 'platform:iOS Simulator' \
            | grep -iE 'name:iPhone' \
            | grep -oE 'id:[0-9A-Fa-f-]+' | head -1 | cut -d: -f2)
          if [ -z "$DEST_ID" ]; then
            echo "No iPhone simulator destination found for the Profile scheme" >&2
            exit 1
          fi
          echo "Testing on simulator id=$DEST_ID"
          xcodebuild test \
            -scheme Profile \
            -destination "id=$DEST_ID" \
            -clonedSourcePackagesDirPath .spm \
            -skipMacroValidation
