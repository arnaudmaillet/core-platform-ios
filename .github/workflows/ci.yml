name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Which packages have tests ────────────────────────────────────────────
  # Ubuntu, not macOS: this is a `find` over the working tree, and macOS
  # runners are the scarce resource (5 concurrent on the free plan for public
  # repos). Emits the matrix the test job fans out over.
  discover:
    name: discover packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: List packages under test
        id: list
        run: |
          set -euo pipefail

          entries=()

          # Every local package that has a test target (a Tests/ dir with sources).
          for manifest in $(find Packages -name Package.swift -not -path '*/.build/*' | sort); do
            dir=$(dirname "$manifest")
            ls "$dir"/Tests/*/*.swift >/dev/null 2>&1 || continue
            name=$(grep -m1 -E 'name:[[:space:]]*"' "$dir/Package.swift" | sed -E 's/.*name:[[:space:]]*"([^"]+)".*/\1/')
            entries+=("{\"label\":\"$name\",\"name\":\"$name\",\"dir\":\"$dir\",\"scheme\":\"\",\"avsbdl\":\"\"}")
          done

          # MediaPlayback's AVSampleBufferDisplayLayer backing is the process
          # default, and layerClass resolves once per process — so the entry
          # above only ever covers the new path. This second entry forwards
          # AVSBDL_RENDER=0 to the test runner to cover the legacy
          # AVPlayerLayer backing; the suite prints which backing it actually
          # got ("[avsbdl-test] backing = ..."), so a forwarding regression is
          # visible in the log rather than a silent double-run of one path.
          # It pins the product scheme deliberately: the -Package scheme would
          # drag in siblings this pass does not need.
          entries+=('{"label":"MediaPlayback (legacy AVPlayerLayer)","name":"MediaPlayback","dir":"Packages/Core/MediaPlayback","scheme":"MediaPlayback","avsbdl":"0"}')

          matrix=$(printf '%s\n' "${entries[@]}" | paste -sd, - )
          matrix="[$matrix]"
          echo "$matrix" | python3 -m json.tool > /dev/null   # fail loudly on malformed JSON
          echo "Packages under test:"
          echo "$matrix" | python3 -c 'import json,sys; [print(" -", e["label"]) for e in json.load(sys.stdin)]'
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # ── The app itself ───────────────────────────────────────────────────────
  # Off the critical path: this runs alongside the test lanes.
  build-app:
    name: build app
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          # macos-latest's default Xcode is nondeterministic; the project needs
          # the iOS 26 SDK (Liquid Glass APIs). Pin the newest installed Xcode
          # 26.x rather than trusting the default.
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "No Xcode 26.x found on this runner" >&2
            ls -d /Applications/Xcode_*.app 2>/dev/null >&2 || true
            exit 1
          fi
          echo "Selecting $XC"
          sudo xcode-select -s "$XC/Contents/Developer"

      - name: Toolchain & simulators
        run: |
          xcodebuild -version
          echo "--- installed iOS runtimes ---"
          xcrun simctl list runtimes | grep -i ios || true

      - name: Resolve Swift packages
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project core-platform-ios.xcodeproj \
            -scheme core-platform-ios \
            -clonedSourcePackagesDirPath .spm

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild build \
            -project core-platform-ios.xcodeproj \
            -scheme core-platform-ios \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            -clonedSourcePackagesDirPath .spm \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      # ⚠️ RELEASE TOO, AND THIS STEP EXISTS BECAUSE ITS ABSENCE SHIPPED.
      #
      # Everything above builds Debug, so `#if DEBUG` members and the code that
      # calls them are compiled together and always agree. A production call
      # site reaching a fenced member is then invisible: the app simply does
      # not compile for Release, and nothing here noticed for months. Six of
      # them had accumulated across two pull requests.
      #
      # It is a compile, not a test run — the point is the configuration, and
      # the tests all build Debug for the simulator anyway.
      - name: Build app (Release)
        run: |
          set -o pipefail
          xcodebuild build \
            -project core-platform-ios.xcodeproj \
            -scheme core-platform-ios \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release \
            -clonedSourcePackagesDirPath .spm \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

  # ── One lane per package ─────────────────────────────────────────────────
  # Was a sequential loop in a single job: 18 invocations, 45 min, of which
  # ~5 min was test execution. The rest was the shared dependency graph
  # (SwiftProtobuf, Connect, CoreModels, DesignSystem) recompiled once per
  # package, because each package gets its own DerivedData tree. Parallelism,
  # not sharing DerivedData, is the fix: a shared tree would put every module
  # on every target's search path and hide exactly the missing-dependency bug
  # this CI exists to catch (PR #127).
  test:
    name: test ${{ matrix.pkg.label }}
    needs: discover
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false      # one red package must not hide the others
      # The free plan allows 5 concurrent macOS jobs across the account.
      # 4 leaves a slot so a second PR's run is not starved behind this one;
      # raise it if the concurrency ceiling ever does.
      max-parallel: 4
      matrix:
        pkg: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "No Xcode 26.x found on this runner" >&2
            ls -d /Applications/Xcode_*.app 2>/dev/null >&2 || true
            exit 1
          fi
          echo "Selecting $XC"
          sudo xcode-select -s "$XC/Contents/Developer"

      - name: Test ${{ matrix.pkg.label }}
        working-directory: ${{ matrix.pkg.dir }}
        env:
          # Empty for every lane but the legacy-backing one. VideoRenderFlags
          # only reacts to the literal "0", so an empty value is the default
          # path — no conditional needed.
          TEST_RUNNER_AVSBDL_RENDER: ${{ matrix.pkg.avsbdl }}
        run: |
          set -o pipefail
          SPM="$GITHUB_WORKSPACE/.spm"
          NAME='${{ matrix.pkg.name }}'

          # On a fresh runner xcodebuild reports "Supported platforms for the
          # buildables is empty" and falls back to My Mac unless the package
          # resolves first.
          xcodebuild -resolvePackageDependencies -scheme "$NAME" -clonedSourcePackagesDirPath "$SPM"

          # Multi-product packages (e.g. CoreNetworking + CoreNetworkingMocks)
          # put the test action on the auto-generated "<name>-Package" scheme,
          # not the product scheme; single-product packages only have "<name>".
          # Prefer -Package when it exists, unless the matrix pinned a scheme.
          SCHEME='${{ matrix.pkg.scheme }}'
          if [ -z "$SCHEME" ]; then
            SCHEME="$NAME"
            if xcodebuild -list -clonedSourcePackagesDirPath "$SPM" 2>/dev/null \
                 | grep -qE "^[[:space:]]+${NAME}-Package$"; then
              SCHEME="${NAME}-Package"
            fi
          fi
          echo "Using scheme: $SCHEME"

          # A concrete iPhone simulator from xcodebuild's own destination list
          # for THIS scheme (guaranteed valid) — a simctl UDID is not
          # guaranteed to be in the scheme's destination list.
          DEST_ID=$(xcodebuild -scheme "$SCHEME" -showdestinations \
            -clonedSourcePackagesDirPath "$SPM" 2>/dev/null \
            | grep 'platform:iOS Simulator' | grep -iE 'name:iPhone' \
            | grep -oE 'id:[0-9A-Fa-f-]+' | head -1 | cut -d: -f2)
          if [ -z "$DEST_ID" ]; then
            echo "No iPhone simulator destination found for scheme $SCHEME" >&2
            xcrun simctl list runtimes | grep -i ios >&2 || true
            exit 1
          fi
          echo "Using simulator id=$DEST_ID"

          xcodebuild test -scheme "$SCHEME" -destination "id=$DEST_ID" \
            -clonedSourcePackagesDirPath "$SPM" -skipMacroValidation

  # ── The required check ───────────────────────────────────────────────────
  # `develop`'s branch protection requires a status check literally named
  # "build-test". Keep this job's name in sync with it, or merges stop being
  # gated on anything.
  build-test:
    name: build-test
    needs: [discover, build-app, test]
    # !cancelled(), not always(): with always() a cancelled run would still
    # report a red required check instead of no check at all.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Collect results
        run: |
          set -uo pipefail
          echo "discover:  ${{ needs.discover.result }}"
          echo "build-app: ${{ needs.build-app.result }}"
          echo "test:      ${{ needs.test.result }}"   # aggregate of every lane
          FAILED=()
          [ "${{ needs.discover.result }}"  = "success" ] || FAILED+=("discover")
          [ "${{ needs.build-app.result }}" = "success" ] || FAILED+=("build-app")
          [ "${{ needs.test.result }}"      = "success" ] || FAILED+=("test")
          if [ ${#FAILED[@]} -ne 0 ]; then
            echo "::error::Failed: ${FAILED[*]} — open the job list above for the failing lane"
            exit 1
          fi
          echo "App builds (Debug + Release) and all package tests passed."
