name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test
    runs-on: macos-latest
    # 90, not 60: the sequential per-package test loop rebuilds the shared
    # dependency graph each iteration, and a PR touching a bottom-of-graph
    # package (CoreNetworking et al.) invalidates it for EVERY package — a
    # green run was timeout-cancelled at exactly 60:00 mid-loop (PR #49).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          # macos-latest's default Xcode is nondeterministic; the project needs
          # the iOS 26 SDK (Liquid Glass APIs). Pin the newest installed Xcode
          # 26.x rather than trusting the default.
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "No Xcode 26.x found on this runner" >&2
            ls -d /Applications/Xcode_*.app 2>/dev/null >&2 || true
            exit 1
          fi
          echo "Selecting $XC"
          sudo xcode-select -s "$XC/Contents/Developer"

      - name: Toolchain & simulators
        run: |
          xcodebuild -version
          echo "--- installed iOS runtimes ---"
          xcrun simctl list runtimes | grep -i ios || true

      - name: Resolve Swift packages
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project core-platform-ios.xcodeproj \
            -scheme core-platform-ios \
            -clonedSourcePackagesDirPath .spm

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild build \
            -project core-platform-ios.xcodeproj \
            -scheme core-platform-ios \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            -clonedSourcePackagesDirPath .spm \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      # ⚠️ RELEASE TOO, AND THIS STEP EXISTS BECAUSE ITS ABSENCE SHIPPED.
      #
      # Everything above builds Debug, so `#if DEBUG` members and the code that
      # calls them are compiled together and always agree. A production call
      # site reaching a fenced member is then invisible: the app simply does
      # not compile for Release, and nothing here noticed for months. Six of
      # them had accumulated across two pull requests.
      #
      # It is a compile, not a test run — the point is the configuration, and
      # the tests all build Debug for the simulator anyway.
      - name: Build app (Release)
        run: |
          set -o pipefail
          xcodebuild build \
            -project core-platform-ios.xcodeproj \
            -scheme core-platform-ios \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release \
            -clonedSourcePackagesDirPath .spm \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Pick simulator
        id: sim
        run: |
          set -o pipefail
          # A concrete iPhone simulator from xcodebuild's own destination list
          # (guaranteed valid), reused for every package's tests since they all
          # target the same platform.
          DEST_ID=$(xcodebuild -project core-platform-ios.xcodeproj -scheme core-platform-ios \
            -showdestinations -clonedSourcePackagesDirPath .spm 2>/dev/null \
            | grep 'platform:iOS Simulator' | grep -iE 'name:iPhone' \
            | grep -oE 'id:[0-9A-Fa-f-]+' | head -1 | cut -d: -f2)
          if [ -z "$DEST_ID" ]; then
            echo "No iPhone simulator destination found" >&2
            exit 1
          fi
          echo "Using simulator id=$DEST_ID"
          echo "id=$DEST_ID" >> "$GITHUB_OUTPUT"

      - name: Test all packages
        run: |
          set -uo pipefail
          SPM="$GITHUB_WORKSPACE/.spm"           # shared checkouts, resolved once above
          DEST="id=${{ steps.sim.outputs.id }}"
          FAILED=()

          # Runs a single package's tests. Multi-product packages (e.g.
          # CoreNetworking + CoreNetworkingMocks) put the test action on the
          # auto-generated "<name>-Package" scheme, not the product scheme;
          # single-product packages only have "<name>". Prefer -Package when it
          # exists.
          test_package() {
            local dir="$1" name="$2"
            cd "$dir" || return 1
            xcodebuild -resolvePackageDependencies -scheme "$name" -clonedSourcePackagesDirPath "$SPM" || return 1
            local scheme="$name"
            if xcodebuild -list -clonedSourcePackagesDirPath "$SPM" 2>/dev/null \
                 | grep -qE "^[[:space:]]+${name}-Package$"; then
              scheme="${name}-Package"
            fi
            echo "Using scheme: $scheme"
            xcodebuild test -scheme "$scheme" -destination "$DEST" \
              -clonedSourcePackagesDirPath "$SPM" -skipMacroValidation
          }

          # Every local package that has a test target (a Tests/ dir with sources).
          PKG_DIRS=$(for manifest in $(find Packages -name Package.swift -not -path '*/.build/*'); do
            dir=$(dirname "$manifest")
            if ls "$dir"/Tests/*/*.swift >/dev/null 2>&1; then echo "$dir"; fi
          done | sort)

          echo "Packages under test:"; echo "$PKG_DIRS"

          for dir in $PKG_DIRS; do
            name=$(grep -m1 -E 'name:[[:space:]]*"' "$dir/Package.swift" | sed -E 's/.*name:[[:space:]]*"([^"]+)".*/\1/')
            echo "::group::Test $name ($dir)"
            if ( test_package "$dir" "$name" ); then
              echo "PASS $name"
            else
              echo "FAIL $name"
              FAILED+=("$name")
            fi
            echo "::endgroup::"
          done

          # MediaPlayback's AVSampleBufferDisplayLayer backing is the process
          # default, and layerClass resolves once per process — so the loop
          # above only ever covered the new path. This second run forwards
          # AVSBDL_RENDER=0 to the test runner to cover the legacy
          # AVPlayerLayer backing; the suite prints which backing it actually
          # got ("[avsbdl-test] backing = ..."), so a forwarding regression is
          # visible in the log rather than a silent double-run of one path.
          echo "::group::Test MediaPlayback (legacy AVPlayerLayer backing)"
          if ( cd "$GITHUB_WORKSPACE/Packages/Core/MediaPlayback" && \
               env TEST_RUNNER_AVSBDL_RENDER=0 \
                 xcodebuild test -scheme MediaPlayback -destination "$DEST" \
                 -clonedSourcePackagesDirPath "$SPM" -skipMacroValidation ); then
            echo "PASS MediaPlayback (legacy backing)"
          else
            echo "FAIL MediaPlayback (legacy backing)"
            FAILED+=("MediaPlayback-legacy-backing")
          fi
          echo "::endgroup::"

          if [ ${#FAILED[@]} -ne 0 ]; then
            echo "::error::Failed package tests: ${FAILED[*]}"
            exit 1
          fi
          echo "All package tests passed."
