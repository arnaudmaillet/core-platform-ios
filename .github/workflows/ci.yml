name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

# A pull request's new push cancels its own stale run. A push to develop never
# cancels the one in progress: it waits, and a newer push replaces it while it
# waits, so one full run is always going and the latest develop is always the
# next one tested.
#
# ⚠️ WHY develop MUST NOT CANCEL ITSELF. A pull request runs only the lanes
# `select_packages.py` picks from its diff, so the run on develop is the ONLY
# full-suite run. With cancel-in-progress it was the run every merge killed:
# on 2026-10-05, nine of the twelve develop runs between 09:26 and 20:08 UTC
# were CANCELLED, and one that did finish (70cd349) caught a break no pull
# request run could see — #530, a Feed-only change, failing DesignSystem's
# repo-wide font guard.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Compile-time savings that change nothing a build can catch:
#
# - No index store (NO_INDEX, on every compile). xcodebuild indexes while it
#   builds by default; CI never opens the index.
# - ARCHS=arm64 on the app builds. `generic/platform=iOS Simulator`
#   has no active arch, so Debug and Release each compiled the whole graph
#   TWICE, arm64 and x86_64 (1354 SwiftCompile lines of each in run
#   36793858807). Every runner and every Mac this project targets is Apple
#   silicon; the test lanes already build arm64 only, through their concrete
#   destination.
#
# - Compilation caching on the app's Debug build (#2369). Every compile is
#   keyed on its inputs and its whole command line in a content-addressed
#   store; a key includes the module's search paths, so unlike a shared
#   DerivedData it hides no missing dependency. Keys also include absolute
#   paths, which are the same on every runner, so the store develop saved
#   answers the next run's unchanged modules. (Prefix mapping would make keys
#   path-free, for worktrees too, but Swift crashes replaying cached warnings
#   with it on: Xcode 27.2, `replayCachedDiagnostics`.) Only a push to develop
#   saves the store, so pull requests never fill the repository's 10 GB cache
#   with copies of their own.
env:
  NO_INDEX: COMPILER_INDEX_STORE_ENABLE=NO
  CAS_DIR: /Users/runner/compilation-cas

jobs:
  # ── Which packages have tests ────────────────────────────────────────────
  # Ubuntu, not macOS: this is a `find` over the working tree, and macOS
  # runners are the scarce resource (5 concurrent on the free plan for public
  # repos). Emits the matrix the test job fans out over.
  discover:
    name: discover packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      count: ${{ steps.list.outputs.count }}
      app: ${{ steps.list.outputs.app }}
    steps:
      # ⚠️ A PUSH TO DEVELOP WAITS ITS TURN. Every merge is followed within a
      # minute by `update-branch` on the next pull request, so the develop run
      # and that pull request's run were queued together — and the develop run,
      # a few seconds older and twice the size (every lane), took the macOS
      # slots first: the pull request someone is waiting on queued behind a
      # backstop nobody is. Three minutes of an Ubuntu runner (free here) puts
      # the backstop behind it instead. A merge landing meanwhile no longer
      # cancels it (see `concurrency`): its run waits, replacing any older
      # waiting one, and goes once this backstop has finished.
      - name: Let pull request runs go first
        if: ${{ github.event_name == 'push' }}
        run: sleep 180

      - uses: actions/checkout@v4
        with:
          # Full history: the lane selection diffs against the pull request's
          # base commit, and a shallow clone has nothing to diff against.
          fetch-depth: 0

      - name: Choose test lanes
        id: list
        env:
          # Empty on a push to develop, which is what makes that run the full
          # set — the backstop for a closure this script got wrong.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/scripts/select_packages.py

  # ── The app itself ───────────────────────────────────────────────────────
  # Runs alongside the test lanes. It is the whole critical path of a pull
  # request that reaches one lane or none, so every minute here is a minute of
  # waiting on those.
  build-app:
    name: build app
    needs: discover
    # Skipped only for a documentation-only change (see select_packages.py).
    if: ${{ needs.discover.outputs.app == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          # macos-latest's default Xcode is nondeterministic; the project needs
          # the iOS 26 SDK (Liquid Glass APIs). Pin the newest installed Xcode
          # 26.x rather than trusting the default.
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "No Xcode 26.x found on this runner" >&2
            ls -d /Applications/Xcode_*.app 2>/dev/null >&2 || true
            exit 1
          fi
          echo "Selecting $XC"
          sudo xcode-select -s "$XC/Contents/Developer"

      - name: Toolchain & simulators
        run: |
          xcodebuild -version
          echo "--- installed iOS runtimes ---"
          xcrun simctl list runtimes | grep -i ios || true

      # The remote packages' git mirrors (SwiftProtobuf, Connect and the NIO
      # stack, Lottie) in SwiftPM's shared cache, which xcodebuild clones from
      # before it touches the network. A cold runner fetched all nine from
      # GitHub in every job: 0.3-1.4 min per lane, ~14 macOS minutes per full
      # run. Only the MIRRORS: `.spm`'s checkouts and workspace state are
      # recreated from them in seconds, and restoring a stale checkout is how a
      # cache starts answering for a resolution it did not make. This job
      # resolves the app, which reaches every remote package, so it is the one
      # that saves; the lanes only restore. A mirror holds every tag, so the
      # lanes' own (older) pins resolve from it too.
      - name: Cache Swift package mirrors
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm/repositories
          key: spm-mirrors-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-mirrors-

      # The store develop saved last (see the header): this commit's, else the
      # newest for these package pins, else any.
      - name: Restore compilation cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CAS_DIR }}
          key: cas-v1-${{ hashFiles('**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            cas-v1-${{ hashFiles('**/Package.resolved') }}-
            cas-v1-

      - name: Resolve Swift packages
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project core-platform-ios.xcodeproj \
            -scheme core-platform-ios \
            -clonedSourcePackagesDirPath .spm

      - name: Build app
        run: |
          set -o pipefail
          build() {
            xcodebuild build \
              -project core-platform-ios.xcodeproj \
              -scheme core-platform-ios \
              -destination "generic/platform=iOS Simulator" \
              -configuration Debug \
              -clonedSourcePackagesDirPath .spm \
              -skipMacroValidation \
              CODE_SIGNING_ALLOWED=NO ARCHS=arm64 "$NO_INDEX" "$@" 2>&1 | tee build-debug.log
          }
          if ! build COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH="$CAS_DIR" \
                     COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES; then
            # A crash of the build service is the cache's fault, not the
            # change's: build again without it rather than fail the run.
            grep -q "build system has crashed" build-debug.log || exit 1
            echo "::warning::The build service crashed with compilation caching on; building without it"
            build COMPILATION_CACHE_ENABLE_CACHING=NO
          fi
          HITS=$(grep -c '^Cache hit' build-debug.log || true)
          MISSES=$(grep -c '^Cache miss' build-debug.log || true)
          echo "Compilation cache (Debug): $HITS hits, $MISSES misses" | tee -a "$GITHUB_STEP_SUMMARY"

      # Saved by develop only (see the header), under this commit's key.
      - name: Save compilation cache
        if: ${{ github.event_name == 'push' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CAS_DIR }}
          key: cas-v1-${{ hashFiles('**/Package.resolved') }}-${{ github.sha }}

      # ⚠️ RELEASE TOO, AND THIS STEP EXISTS BECAUSE ITS ABSENCE SHIPPED.
      #
      # Everything above builds Debug, so `#if DEBUG` members and the code that
      # calls them are compiled together and always agree. A production call
      # site reaching a fenced member is then invisible: the app simply does
      # not compile for Release, and nothing here noticed for months. Six of
      # them had accumulated across two pull requests.
      #
      # It is a compile, not a test run — the point is the configuration, and
      # the tests all build Debug for the simulator anyway.
      #
      # So a pull request compiles Release WITHOUT the optimiser: the
      # configuration (no DEBUG condition, Release's own settings) is what
      # catches a fenced member, and `-O` over the whole graph was 5.7 of this
      # job's 9.8 minutes (PR #354). The optimiser still runs on every push to
      # develop, where a crash inside it would surface — nobody waits on that
      # run.
      - name: Build app (Release)
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -o pipefail
          OPT=()
          if [ "$EVENT" = "pull_request" ]; then
            OPT=(SWIFT_OPTIMIZATION_LEVEL=-Onone GCC_OPTIMIZATION_LEVEL=0)
          fi
          xcodebuild build \
            -project core-platform-ios.xcodeproj \
            -scheme core-platform-ios \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release \
            -clonedSourcePackagesDirPath .spm \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 "$NO_INDEX" "${OPT[@]}"

  # ── One lane per package ─────────────────────────────────────────────────
  # Was a sequential loop in a single job: 18 invocations, 45 min, of which
  # ~5 min was test execution. The rest was the shared dependency graph
  # (SwiftProtobuf, Connect, CoreModels, DesignSystem) recompiled once per
  # package, because each package gets its own DerivedData tree. Parallelism,
  # not sharing DerivedData, is the fix: a shared tree would put every module
  # on every target's search path and hide exactly the missing-dependency bug
  # this CI exists to catch (PR #127).
  test:
    name: test ${{ matrix.pkg.label }}
    needs: discover
    # A change that cannot reach any package (app sources, docs) selects no
    # lanes. Guard on the count rather than handing GitHub an empty matrix.
    if: ${{ needs.discover.outputs.count != '0' }}
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false      # one red package must not hide the others
      # The free plan allows 5 concurrent macOS jobs across the account.
      # A pull request takes 4 (the app build is the fifth). The develop
      # backstop takes 2, so a pull request queued after it still finds
      # slots; it is the run nobody is waiting on.
      max-parallel: ${{ github.event_name == 'push' && 2 || 4 }}
      matrix:
        # Longest lane first (select_packages.py), so the last slot to free
        # up is not running Upload alone.
        pkg: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "No Xcode 26.x found on this runner" >&2
            ls -d /Applications/Xcode_*.app 2>/dev/null >&2 || true
            exit 1
          fi
          echo "Selecting $XC"
          sudo xcode-select -s "$XC/Contents/Developer"

      # Restore only: `build app` saves these (see there).
      - name: Restore Swift package mirrors
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm/repositories
          key: spm-mirrors-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-mirrors-

      # `lanes` is what this job runs, one after another: `dir name scheme
      # shard` per package, `-` for an empty field (select_packages.py). A
      # long lane is one shard of a package (#2370: Feed in two); short ones
      # share a job, paying its fixed cost — checkout, Xcode, mirrors, a
      # simulator boot — once. Each package keeps its own DerivedData (the
      # default, per package), so no module leaks onto another's search path.
      - name: Test ${{ matrix.pkg.label }}
        env:
          # Empty for every lane but the legacy-backing one. VideoRenderFlags
          # only reacts to the literal "0", so an empty value is the default
          # path — no conditional needed.
          TEST_RUNNER_AVSBDL_RENDER: ${{ matrix.pkg.avsbdl }}
          LANES: ${{ matrix.pkg.lanes }}
        run: |
          set -o pipefail
          SPM="$GITHUB_WORKSPACE/.spm"
          read -ra FIELDS <<< "$LANES"
          FAILED=()
          for ((i = 0; i < ${#FIELDS[@]}; i += 4)); do
            DIR="${FIELDS[i]}"; NAME="${FIELDS[i+1]}"
            PINNED="${FIELDS[i+2]}"; SHARD="${FIELDS[i+3]}"
            [ "$PINNED" = "-" ] && PINNED=""
            [ "$SHARD" = "-" ] && SHARD=""
            echo "::group::$NAME${SHARD:+ ($SHARD)}"
            if ! (
              cd "$GITHUB_WORKSPACE/$DIR"

              # On a fresh runner xcodebuild reports "Supported platforms for
              # the buildables is empty" and falls back to My Mac unless the
              # package resolves first.
              xcodebuild -resolvePackageDependencies -scheme "$NAME" -clonedSourcePackagesDirPath "$SPM"

              # Multi-product packages (e.g. CoreNetworking + CoreNetworkingMocks)
              # put the test action on the auto-generated "<name>-Package"
              # scheme, not the product scheme; single-product packages only
              # have "<name>". Prefer -Package when it exists, unless the
              # matrix pinned a scheme.
              SCHEME="$PINNED"
              if [ -z "$SCHEME" ]; then
                SCHEME="$NAME"
                if xcodebuild -list -clonedSourcePackagesDirPath "$SPM" 2>/dev/null \
                     | grep -qE "^[[:space:]]+${NAME}-Package$"; then
                  SCHEME="${NAME}-Package"
                fi
              fi
              echo "Using scheme: $SCHEME"

              # CoreSimulator enumerates its devices lazily, and asking too
              # early gets an answer with the "Any iOS Simulator Device"
              # placeholder and nothing else (run 33816841427: MediaPlayback
              # green and red on the same scheme). Warm the list, then retry.
              xcrun simctl list devices available >/dev/null 2>&1 || true

              # A concrete iPhone simulator from xcodebuild's own destination
              # list for THIS scheme (guaranteed valid). The `|| true` on the
              # assignments: under `bash -e` and pipefail a grep that matches
              # nothing would abort here, before the diagnostic below runs.
              DEST_ID=""
              for attempt in 1 2 3 4 5 6; do
                DESTS=$(xcodebuild -scheme "$SCHEME" -showdestinations \
                  -clonedSourcePackagesDirPath "$SPM" 2>&1) || true
                DEST_ID=$(printf '%s\n' "$DESTS" \
                  | grep 'platform:iOS Simulator' | grep -iE 'name:iPhone' \
                  | grep -oE 'id:[0-9A-Fa-f-]+' | head -1 | cut -d: -f2) || true
                if [ -n "$DEST_ID" ]; then
                  break
                fi
                echo "attempt $attempt: no iPhone destination yet, retrying"
                printf '%s\n' "$DESTS" | tail -20
                sleep 10
              done
              if [ -z "$DEST_ID" ]; then
                echo "::error::No iPhone simulator destination for scheme $SCHEME after 6 attempts"
                xcrun simctl list runtimes | grep -i ios >&2 || true
                exit 1
              fi
              echo "Using simulator id=$DEST_ID (attempt $attempt)"

              # A shard's filter (#2370): `-only-testing` for its suites, or,
              # for the last shard, `-skip-testing` for every other shard's —
              # so a suite the script cannot see still runs.
              FILTER=()
              if [ -n "$SHARD" ]; then
                read -ra FILTER <<< "$(python3 -I "$GITHUB_WORKSPACE/.github/scripts/test_shard.py" . "${SHARD%/*}" "${SHARD#*/}")"
                echo "Shard $SHARD: ${#FILTER[@]} filter arguments"
              fi

              # ⚠️ DO NOT BOOT THE SIMULATOR DURING THE BUILD (PR #354: a
              # first boot on a 3-core, 7 GB runner starves the compiler). The
              # boot stays where `xcodebuild test` puts it, after the build;
              # a job's later packages find it booted.
              #
              # No sysdiagnose on a red test: it added ~1m40s to every failing
              # lane (run 36904429986) and nothing ever downloads it.
              xcodebuild test -scheme "$SCHEME" -destination "id=$DEST_ID" \
                -clonedSourcePackagesDirPath "$SPM" -skipMacroValidation "$NO_INDEX" \
                -collect-test-diagnostics never "${FILTER[@]}"
            ); then
              FAILED+=("$NAME${SHARD:+ ($SHARD)}")
              echo "::error::$NAME${SHARD:+ ($SHARD)} failed"
            fi
            echo "::endgroup::"
          done
          if [ ${#FAILED[@]} -ne 0 ]; then
            echo "::error::Failed in this job: ${FAILED[*]}"
            exit 1
          fi

  # ── The required check ───────────────────────────────────────────────────
  # `develop`'s branch protection requires a status check literally named
  # "build-test". Keep this job's name in sync with it, or merges stop being
  # gated on anything.
  build-test:
    name: build-test
    needs: [discover, build-app, test]
    # !cancelled(), not always(): with always() a cancelled run would still
    # report a red required check instead of no check at all.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Collect results
        run: |
          set -uo pipefail
          echo "discover:  ${{ needs.discover.result }}"
          echo "build-app: ${{ needs.build-app.result }}"
          echo "test:      ${{ needs.test.result }}"   # aggregate of every lane
          FAILED=()
          [ "${{ needs.discover.result }}"  = "success" ] || FAILED+=("discover")
          # "skipped" is a pass ONLY when discover said so (documentation-only
          # change). A build skipped for any other reason is not a green build.
          case "${{ needs.build-app.result }}/${{ needs.discover.outputs.app }}" in
            success/*|skipped/false) ;;
            *) FAILED+=("build-app") ;;
          esac
          # "skipped" is a pass here: it means the change could not reach any
          # package. Without this the required check fails on a docs-only or
          # app-only pull request.
          case "${{ needs.test.result }}" in
            success|skipped) ;;
            *) FAILED+=("test") ;;
          esac
          if [ ${#FAILED[@]} -ne 0 ]; then
            echo "::error::Failed: ${FAILED[*]} — open the job list above for the failing lane"
            exit 1
          fi
          if [ "${{ needs.build-app.result }}" = "skipped" ]; then
            echo "Documentation-only change: nothing to build or test."
          elif [ "${{ needs.test.result }}" = "skipped" ]; then
            echo "App builds (Debug + Release) passed. No package could be reached by this change, so no lane ran."
          else
            echo "App builds (Debug + Release) and every selected package test passed."
          fi
