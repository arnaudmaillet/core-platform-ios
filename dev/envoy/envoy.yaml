# Local dev gRPC-Web gateway for the iOS client.
#
# The core-platform fleet serves raw gRPC over h2c (HTTP/2 cleartext), which
# URLSession — and therefore connect-swift's URLSession transport — cannot
# reach. This Envoy listener terminates gRPC-Web over HTTP/1.1 from the client
# and translates to the h2c gRPC upstreams, path-routing by the proto
# package/service prefix. The iOS client points at a single host
# (http://localhost:8080) using connect-swift's gRPC-Web protocol.
#
# Run via dev/fleet-gateway.sh (attaches to the fleet's docker network so the
# `*-server` aliases resolve).

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: client_listener
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: fleet
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/auth.v1.AuthService/" }
                          route: { cluster: auth, timeout: 30s }
                        - match: { prefix: "/account.v1.AccountService/" }
                          route: { cluster: account, timeout: 30s }
                        - match: { prefix: "/profile.v1.ProfileService/" }
                          route: { cluster: profile, timeout: 30s }
                        - match: { prefix: "/post.v1.PostService/" }
                          route: { cluster: post, timeout: 30s }
                        - match: { prefix: "/timeline.v1.TimelineService/" }
                          route: { cluster: timeline, timeout: 30s }
                        - match: { prefix: "/engagement.v1.EngagementService/" }
                          route: { cluster: engagement, timeout: 30s }
                        - match: { prefix: "/counter.v1.CounterService/" }
                          route: { cluster: counter, timeout: 30s }
                        - match: { prefix: "/media.v1.MediaService/" }
                          route: { cluster: media, timeout: 30s }
                        - match: { prefix: "/notification.v1.NotificationService/" }
                          route: { cluster: notification, timeout: 30s }
                        - match: { prefix: "/chat.v1.ChatService/" }
                          route: { cluster: chat, timeout: 30s }
                        - match: { prefix: "/social_graph.v1.SocialGraphService/" }
                          route: { cluster: social_graph, timeout: 30s }
                        - match: { prefix: "/comment.v1.CommentService/" }
                          route: { cluster: comment, timeout: 30s }
                http_filters:
                  - name: envoy.filters.http.grpc_web
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: auth
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: auth
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: auth-server, port_value: 50060 } } }
    - name: account
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: account
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: account-server, port_value: 50059 } } }
    - name: profile
