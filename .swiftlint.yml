included:
  - App
  - Packages

excluded:
  - "**/.build"
  - "**/DerivedData"

opt_in_rules:
  - empty_count
  - fatal_error_message
  - first_where
  - last_where
  - contains_over_filter_is_empty
  - contains_over_filter_count
  - redundant_nil_coalescing
  - unowned_variable_capture
  - weak_delegate

analyzer_rules:
  - unused_declaration
  - unused_import

line_length:
  warning: 120
  ignores_comments: true

type_body_length:
  warning: 300

file_length:
  warning: 500

identifier_name:
  min_length: 2
  excluded: [x, y, i]
